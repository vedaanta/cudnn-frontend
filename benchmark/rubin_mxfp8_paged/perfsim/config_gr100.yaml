FastACE:
  ranges: null
  create_fastace:
    -queue: o_cpu_8G_24H
Checkpoints:
  mods_check_crc: true
  perfgen:
    -PERFSIM:knob:
    - "'NVPerfsim::PerfSim::NoOutputTimeout 1 9000000'"
    - "'NVPerfsim::L2C::cleanLTCBackDoorOnePMTrigger 0'"
    - "'NVPerfsim::L2C::cleanLTCBackDoorTwoPMTrigger 0'"
    -debug: 0
    -dont-fail-on-p4-check: null
    -queue:
    - PERFSIM o_cpu_64G_48H
    - REPORT o_cpu_4G_4H
    - FINAL o_cpu_4G_4H
    -rc:
    - ${chip}/${chip}_flow.perfsim.rc
    -target: PERFSIM
PerfSim:
  enableMorph: false
  pic: false
  dgpu: false
  numThreads: 4
  FastACE:
    mods_check_crc: true
    perfgen: {}
  skyline:
    tpcs_per_plural_vgpc: null
    singleton_tpcs: null
    singleton_tpc_assignments: null
  perfgen:
    -PERFSIM:knob:
    - "'NVPerfsim::PerfSim::NoOutputTimeout 1 9000000'"
    - "'NVPerfsim::L2C::cleanLTCBackDoorOnePMTrigger 0'"
    - "'NVPerfsim::L2C::cleanLTCBackDoorTwoPMTrigger 0'"
    - "'NVPerfsim::ugpu_localization 1'"
    - "'NVPerfsim::FB::secTop 0xFFFFFFFF'"
    -debug: 0
    -dont-fail-on-p4-check: null
    -queue:
    - PERFSIM o_cpu_64G_48H
    - REPORT o_cpu_4G_48H
    - FINAL o_cpu_4G_48H
    -PERFSIM:run_type: app_perf
    -PERFSIM:run_catalyze_for_app_trace: null
    -PERFSIM:generate_all_nvpdms_if_perfalyze_is_disabled: null
    -PERFSIM:generate-nvpdms-for-instance: -1
    -no-perfalyze: null
    -rc:
    - ${chip}/${chip}_flow.perfsim.rc
    - /home/scratch.vagarwalla_gpu/perfsim/perfsim_glueviz_memsys_fb.rc
    -target: PERFSIM
    -mdiagArgsMore:
    - "'-utl_script +begin /home/scratch.vagarwalla_gpu/perfsim/ugpu_localization_perfsim.py\
      \ +end'"
PIC_Analysis:
  lsfQueue: o_cpu_64G_4H
  lsfTimeout: -1
  lsfCpus: 8
  pic-perfsim:
    --dump-all-morph-tpc: false
    --barrier-analysis: true
